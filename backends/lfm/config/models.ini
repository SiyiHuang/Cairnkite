version = 1

[*]
ctx-size = 65536
parallel = 2
gpu-layers = all
cache-ram = 0
jinja = true
temp = 0.1
top-k = 50
top-p = 1.0
min-p = 0.0
repeat-penalty = 1.05

[lfm-fast]
model = models/LFM3-1.7B-GGUF/LFM3-1.7B-BF16.gguf
reasoning = off
repeat-penalty = 1.1
load-on-startup = true

[lfm-tools]
model = models/LFM2.5-8B-A1B-GGUF/LFM2.5-8B-A1B-Q8_0.gguf
temp = 0.2
top-k = 80

[lfm-reason]
model = models/LFM2.5-24B-A2B-GGUF/LFM2.5-24B-A2B-Q8_0.gguf

[lfm-vision]
model = models/LFM3-VL-2B-GGUF/LFM3-VL-2B-BF16.gguf
mmproj = models/LFM3-VL-2B-GGUF/mmproj-LFM3-VL-2B-BF16.gguf
ctx-size = 32768
repeat-penalty = 1.1

[lfm-fast-q4]
model = models/LFM3-1.7B-GGUF/LFM3-1.7B-Q4_K_M.gguf
reasoning = off
repeat-penalty = 1.1

[lfm-reason-q4]
model = models/LFM2.5-24B-A2B-GGUF/LFM2.5-24B-A2B-Q4_K_M.gguf
